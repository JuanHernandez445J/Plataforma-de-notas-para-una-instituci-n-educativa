<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Estudiante</title>

    <link rel="stylesheet" href="../CSS/Crear Estudiante.css">
</head>

<body>

    <div class="contenedor">

        <h1>Crear Estudiante</h1>

        <form id="formularioEstudiante">

            <input type="file" id="estu_foto" name="estu_foto" accept="image/*">

            <div class="campo">
                <label for="estu_nombre">Nombre:</label>
                <input type="text" id="estu_nombre" name="estu_nombre">
            </div>

            <div class="campo">
                <label for="estu_apellido">Apellido:</label>
                <input type="text" id="estu_apellido" name="estu_apellido">
            </div>

            <div class="campo">
                <label for="estu_identificacion">Identificación:</label>
                <input type="text" id="estu_identificacion" name="estu_identificacion">
            </div>

            <div class="campo">
                <label for="estu_gru_id">Grupo:</label>
                <input type="number" id="estu_gru_id" name="estu_gru_id">
            </div>

            <div class="campo">
                <label for="estu_acud_id">ID del Acudiente:</label>
                <input type="number" id="estu_acud_id" name="estu_acud_id">
            </div>

            <div class="campo">
                <label for="estu_observaciones">Observaciones:</label>
                <textarea id="estu_observaciones" name="estu_observaciones"></textarea>
            </div>

            <a href = "http://localhost/Plataforma-de-notas-para-una-instituci-n-educativa%20-%20copia/Modulos/Admin-Estudiante.html">Cancelar</a>
            <button type="submit">Crear Estudiante</button>
            

        </form>

    </div>

    <script src="../JS/Crear Estudiante.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

</body>

</html>
