<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar Docente</title>

    <link rel="stylesheet" href="../CSS/Eliminar Docente.css">
</head>

<body>

    <div class="contenedor">

        <h1>Eliminar Docente</h1>

        <form id="formularioEliminar">

            <div class="campo">
                <label for="doce_id">ID del Docente:</label>
                <input type="number" id="doce_id" name="doce_id">
            </div>

            <button type="button" id="buscarDocente">
                Buscar Docente
            </button>

            <div id="datosDocente" class="datos" style="display: none;">

                <h2>Datos del Docente</h2>

                <p><strong>Foto:</strong> <span id="foto"></span></p>
                <p><strong>Nombre:</strong> <span id="nombre"></span></p>
                <p><strong>Apellido:</strong> <span id="apellido"></span></p>
                <p><strong>Identificación:</strong> <span id="identificacion"></span></p>
                <p><strong>Dirección:</strong> <span id="direccion"></span></p>
                <p><strong>Teléfono:</strong> <span id="telefono"></span></p>
                <p><strong>Correo:</strong> <span id="email"></span></p>
                <p><strong>Especialidad:</strong> <span id="especialidad"></span></p>

            </div>

            <button type="submit" id="eliminar" style="display: none;">
                Eliminar Docente
            </button>

            <a href="http://localhost/Plataforma-de-notas-para-una-instituci-n-educativa%20-%20copia/Modulos/Admin-Docente.html">
                Cancelar
            </a>

        </form>

    </div>

    <script src="../JS/Eliminar Docente.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
