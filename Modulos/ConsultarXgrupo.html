
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resumir Boletín</title>

    <link rel="stylesheet" href="../CSS/ConsultarXgrupo.css">
</head>
<body>

    <div class="contenedor">

        <h1>Resumir Boletín</h1>

        <form action="../PHP/ConsultarXgrupo.php" method="POST">

            <label for="Grupo">Grupo:</label>
            <input
                type="text"
                id="Grupo"
                name="Grupo"
                placeholder="Ejemplo: 10A"
               
            >

            <label for="Ciclo">Período académico:</label>
            <input
                type="number"
                id="Ciclo"
                name="Ciclo"
                step="1"
                placeholder="Selecciona del 1 al 4"
               
            >

            <label for="Jornad">Jornada:</label>
            <input
                type="text"
                id="Jornad"
                name="Jornad"
                placeholder="Mañana, Tarde o Noche"
                
            >

            <div class="botones">
                <button type="submit">Generar boletines</button>

                <a href="Home_docente.html" class="boton-volver">
                    Volver
                </a>
            </div>

        </form>
            <script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
            <script src="../JS/ConsultarXgrupo.js"></script>
    </div>

</body>
</html>
