<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Materias</title>

    <link rel="stylesheet" href="../CSS/Listar-materias.css">

</head>

<body>
    <div class = "contenedor">

    <h1>Lista de Materias</h1>

    <a href="Admin-Materia.html" class="volver">
        Volver
    </a>

    <input type="text" id="buscarMateria" class="busqueda"
           placeholder="Buscar materia por nombre">

    <button type="button" id="buscarBtn" class="boton-buscar">
        Buscar
    </button>

    <button type="button" id="mostrarTodos" class="boton-buscar">
        Mostrar todos
    </button>

    <div class="tabla-contenedor">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Grupo</th>
                <th>Materia</th>
                <th>ID Docente</th>
                <th>Logro 1</th>
                <th>Logro 2</th>
                <th>Logro 3</th>
                <th>Logro 4</th>
                <th>Intensidad</th>
            </tr>
        </thead>
        <tbody id="listaMaterias"></tbody>
    </table>
</div>


</div>
    <script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
    <script src="../JS/Listar-materias.js"></script>

</body>

</html>
