<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Materias</title>

    <link rel="stylesheet" href="../CSS/Listar-materias.css">

</head>

<body>
    <div class = "contenedor">

    <h1>Lista de Materias</h1>

    <a href="http://localhost/Plataforma-de-notas-para-una-instituci-n-educativa%20-%20copia/Modulos/Admin-Materia.html" class="volver">
        Volver
    </a>

    <input type="text" id="buscarMateria" class="busqueda"
           placeholder="Buscar materia por nombre">

    <button type="button" id="buscarBtn" class="boton-buscar">
        Buscar
    </button>

    <button type="button" id="mostrarTodos" class="boton-buscar">
        Mostrar todos
    </button>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Grupo</th>
                <th>Materia</th>
                <th>Docente</th>
                <th>Logro</th>
                <th>Intensidad</th>
            </tr>

        </thead>

        <tbody id="listaMaterias">

        </tbody>

    </table>


</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/Listar-materias.js"></script>

</body>

</html>
