<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listar Usuarios</title>

    <link rel="stylesheet" href="../CSS/Listar-usuarios.css">

</head>

<body>

    <div class="contenedor">

        <h1>Usuarios Registrados</h1>

        <a href="Admin-Usuarios.html" class="volver">Volver</a>

            <input type="text" id="buscarUsuario" class="busqueda"
                placeholder="Buscar por usuario">

                <button type="button" id="buscarBtn" class="boton-buscar">
                Buscar
                </button>
            <button type="button" id="mostrarTodos" class="boton-buscar">
                Mostrar todos
            </button>
                <strong>1 = activo</strong>
                <strong>0 = inactivo</strong>
        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Activo</th>

                    <th>Usuario</th>

                    <th>Rol</th>

                </tr>

            </thead>


            <tbody id="listaUsuarios">

            </tbody>

        </table>

    </div>

    <script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
    <script src="../JS/Listar-usuarios.js"></script>

</body>

</html>
