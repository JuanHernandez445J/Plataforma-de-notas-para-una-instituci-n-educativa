<head>

</head>

<body>

    <h1>Lista de Estudiantes</h1>
    <a href="Admin-Estudiante.html" class="volver">Volver</a>

    <input type="text" id="buscarEstudiante" class="busqueda"
           placeholder="Buscar estudiante por apellido">

    <button type="button" id="buscarBtn" class="boton-buscar">
        Buscar
    </button>

    <button type="button" id="mostrarTodos" class="boton-buscar">
        Mostrar todos
    </button>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Foto</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Identificacion</th>
            <th>Grupo ID</th>
            <th>Acud ID</th>
            <th>Observaciones</th>
        </tr>
    </thead>

    <tbody id="listaEstudiantes">
    </tbody>
</table>

    </div>
</body>
