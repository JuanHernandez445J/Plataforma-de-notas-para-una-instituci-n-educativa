
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Boletín</title>
    <link rel="stylesheet" href="../CSS/Consultar Boletin.css">
</head>
<body>

    <div class="contenedor">
        <h1>Consultar Boletín</h1>

        <form id="formularioBoletin" action="../PHP/Consultar_Boletin.php" method="POST">
            <label for="Ndoc">Documento de Identidad:</label>
            <input type="text" id="Ndoc" name="Ndoc" placeholder="Escribe tu documento">

            <label for="Ciclo">Periodo académico:</label>
            <input type="number" id="Ciclo" name="Ciclo" min="1" max="4" step="1" placeholder="Del 1 al 4">

            <button type="submit">Consultar boletín</button>

            <a href="javascript:history.back()" class="btn-volver">Volver</a>
        </form>
    </div>

    <script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
    <script src="../JS/Consultar_Boletin.js"></script>

</body>
</html>
