<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar Materia</title>

    <link rel="stylesheet" href="../CSS/Eliminar Materia.css">

</head>

<body>

    <div class="contenedor">

        <h1>Eliminar Materia</h1>

        <form id="formularioEliminar">

            <div class="campo">

                <label for="asig_id">ID de la Materia:</label>

                <input type="number" id="asig_id" name="asig_id">

            </div>


            <button type="button" id="buscarMateria">
                Buscar Materia
            </button>


            <div id="datosMateria" class="datos" style="display: none;">

                <h2>Datos de la Materia</h2>

                <p>
                    <strong>ID:</strong>
                    <span id="id"></span>
                </p>

                <p>
                    <strong>Grupo:</strong>
                    <span id="grupo"></span>
                </p>

                <p>
                    <strong>Nombre:</strong>
                    <span id="nombre"></span>
                </p>

                <p>
                    <strong>Docente:</strong>
                    <span id="docente"></span>
                </p>

                <p>
                    <strong>Logro:</strong>
                    <span id="logro"></span>
                </p>

                <p>
                    <strong>Intensidad:</strong>
                    <span id="intensidad"></span>
                </p>

            </div>


            <button type="submit" id="eliminar" style="display: none;">
                Eliminar Materia
            </button>


            <a href="Admin-Materia.html">
                Cancelar
            </a>

        </form>

    </div>


    <script src="../JS/Eliminar Materia.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
