<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Docentes</title>
    <link rel="stylesheet" href="../CSS/Listar Docentes.css">
</head>

<body>
    <div class="contenedor">
        <h1>Lista de Docentes</h1>

        <a href="Admin-Docente.html" class="volver">Volver</a>

        <div class="controles">
            <input
                type="text"
                id="buscarDocente"
                class="busqueda"
                placeholder="Buscar docente por apellido"
            >

            <button type="button" id="buscarBtn" class="boton-buscar">
                Buscar
            </button>

            <button type="button" id="mostrarTodos" class="boton-buscar">
                Mostrar todos
            </button>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Identificación</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Especialidad</th>
                    </tr>
                </thead>

                <tbody id="listaDocentes"></tbody>
            </table>
        </div>
    </div>

    <script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
    <script src="../JS/Listar-docentes.js"></script>
</body>

</html>
