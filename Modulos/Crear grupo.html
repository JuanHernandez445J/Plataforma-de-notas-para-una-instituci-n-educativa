<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Grupo</title>

    <link rel="stylesheet" href="../CSS/Crear Grupo.css">

</head>

<body>

    <div class="contenedor">

        <h1>Crear Grupo</h1>

        <form id="formularioGrupo">

            <div class="campo">

                <label for="gru_jornada">
                    Jornada:
                </label>

                <input
                    type="text"
                    id="gru_jornada"
                    name="gru_jornada"
                >

            </div>


            <div class="campo">

                <label for="gru_nombre">
                    Nombre del Grupo:
                </label>

                <input
                    type="text"
                    id="gru_nombre"
                    name="gru_nombre"
                >

            </div>


            <a href="Admin-Grupo.html">
                Cancelar
            </a>

            <button type="submit">
                Crear Grupo
            </button>

        </form>

    </div>


    <script src="../JS/Crear Grupo.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
