<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Docente</title>

    <link rel="stylesheet" href="../CSS/Crear Docente.css">

</head>

<body>

    <div class="contenedor">

        <h1>Crear Docente</h1>

        <form id="formularioDocente">

            <div class="campo">
                <label for="doce_foto">Foto:</label>
                <input type="text" id="doce_foto" name="doce_foto">
            </div>

            <div class="campo">
                <label for="doce_nombre">Nombre:</label>
                <input type="text" id="doce_nombre" name="doce_nombre">
            </div>

            <div class="campo">
                <label for="doce_apellido">Apellido:</label>
                <input type="text" id="doce_apellido" name="doce_apellido">
            </div>

            <div class="campo">
                <label for="doce_identificacion">Identificación:</label>
                <input type="text" id="doce_identificacion" name="doce_identificacion">
            </div>

            <div class="campo">
                <label for="doce_direccion">Dirección:</label>
                <input type="text" id="doce_direccion" name="doce_direccion">
            </div>

            <div class="campo">
                <label for="doce_telefono">Teléfono:</label>
                <input type="text" id="doce_telefono" name="doce_telefono">
            </div>

            <div class="campo">
                <label for="doce_email">Correo electrónico:</label>
                <input type="email" id="doce_email" name="doce_email">
            </div>

            <div class="campo">
                <label for="doce_especialidad">Especialidad:</label>
                <input type="text" id="doce_especialidad" name="doce_especialidad">
            </div>

            <a href="Admin-Docente.html">Cancelar</a>

            <button type="submit">
                Crear Docente
            </button>

        </form>

    </div>


    <script src="../JS/Crear Docente.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
