<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Acudiente</title>

    <link rel="stylesheet" href="../CSS/Crear Acudiente.css">

</head>

<body>

    <div class="contenedor">

        <h1>Crear Acudiente</h1>

        <form id="formularioAcudiente">

            <div class="campo">

                <label for="acud_parentesco">
                    Parentesco:
                </label>

                <input type="text" id="acud_parentesco" name="acud_parentesco">

            </div>


            <div class="campo">

                <label for="acud_nombre">
                    Nombre:
                </label>

                <input type="text" id="acud_nombre" name="acud_nombre">

            </div>


            <div class="campo">

                <label for="acud_apellido">
                    Apellido:
                </label>

                <input type="text" id="acud_apellido" name="acud_apellido">

            </div>


            <div class="campo">

                <label for="acud_identificacion">
                    Identificación:
                </label>

                <input type="text" id="acud_identificacion" name="acud_identificacion">

            </div>


            <div class="campo">

                <label for="acud_direccion">
                    Dirección:
                </label>

                <input type="text" id="acud_direccion" name="acud_direccion">

            </div>


            <div class="campo">

                <label for="acud_telefono">
                    Teléfono:
                </label>

                <input type="text" id="acud_telefono" name="acud_telefono">

            </div>


            <div class="campo">

                <label for="acud_email">
                    Correo electrónico:
                </label>

                <input type="email" id="acud_email" name="acud_email">

            </div>


            <a href="http://localhost/Plataforma-de-notas-para-una-instituci-n-educativa%20-%20copia/Modulos/Admin-Acudiente.html">
                Cancelar
            </a>

            <button type="submit">
                Crear Acudiente
            </button>

        </form>

    </div>


    <script src="../JS/Crear Acudiente.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
