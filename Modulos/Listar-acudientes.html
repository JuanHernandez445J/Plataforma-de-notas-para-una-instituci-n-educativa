<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="../CSS/Listar-acudientes.css">
</head>
<body>
    <div class = "contenedor">

    <h1>Lista de Acudientes</h1>

    <a href="Admin-Acudiente.html" class="volver">
        Volver
    </a>

    <input type="text" id="buscarAcudiente" class="busqueda"
           placeholder="Buscar acudiente por apellido">

    <button type="button" id="buscarBtn" class="boton-buscar">
        Buscar
    </button>

    <button type="button" id="mostrarTodos" class="boton-buscar">
        Mostrar todos
    </button>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Parentesco</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Identificacion</th>
                <th>Direccion</th>
                <th>Telefono</th>
                <th>email</th>
            </tr>

        </thead>

        <tbody id="listaAcudientes">

        </tbody>

    </table>
</div>
<script src="../SweetAlert2/dist/sweetalert2.all.min.js"></script>
<script src = "../JS/Listar-acudientes.js"></script>

</html>
