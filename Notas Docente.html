<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Añadir Nota</title>

    <link rel="stylesheet" href="CSS/Notas Docente.css">
</head>

<body>

    <div class="contenedor">

        <div class="panel">

            <div class="encabezado">
                <h1>Añadir Nota</h1>
                <p>Registre la nota del estudiante</p>
            </div>

            <form>

                <div class="campo">
                    <label for="estu_codigo">Código del estudiante</label>

                    <input
                        type="text"
                        id="estu_codigo"
                        name="estu_codigo"
                        placeholder="Ingrese el código del estudiante"
                    >
                </div>


                <div class="campo">
                    <label for="nota_evaluacion">Evaluación</label>

                    <input
                        type="text"
                        id="nota_evaluacion"
                        name="nota_evaluacion"
                        placeholder="Ej: Examen, Taller, Proyecto..."
                    >
                </div>

                <div class="fila">

                    <div class="campo">
                        <label for="nota_valor">Nota obtenida</label>

                        <input
                            type="number"
                            id="nota_valor"
                            name="nota_valor"
                            placeholder="Ej: 4.5"
                            min="0"
                            max="5"
                            step="0.1"
                        >
                    </div>


                    <div class="campo">
                        <label for="nota_porcentaje">Porcentaje</label>

                        <input
                            type="number"
                            id="nota_porcentaje"
                            name="nota_porcentaje"
                            placeholder="Ej: 20"
                            min="1"
                            max="100"
                        >
                    </div>

                </div>

                <div class="campo">
                    <label for="nota_criterio">Criterio a evaluar</label>

                    <textarea
                        id="nota_criterio"
                        name="nota_criterio"
                        placeholder="Describa el criterio que se está evaluando..."
                    ></textarea>
                </div>

                <div class="botones">

                    <button type="reset" class="btn cancelar">
                        Cancelar
                    </button>

                    <button type="submit" class="btn guardar">
                        Añadir nota
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
