<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Docente</title>

    <link rel="stylesheet" href="CSS/Crear Docente.css">
</head>

<body>

    <div class="contenedor">

        <div class="panel">

            <div class="encabezado">
                <h1>Crear Docente</h1>
                <p>Registre la información del nuevo docente</p>
            </div>

            <form>

                <div class="foto">
                    <label for="doce_foto">Foto del docente</label>

                    <input
                        type="file"
                        id="doce_foto"
                        name="doce_foto"
                        accept="image/*"
                    >
                </div>

                <div class="campo">
                    <label for="doce_id">ID del docente</label>

                    <input
                        type="number"
                        id="doce_id"
                        name="doce_id"
                        required
                        placeholder="Ingrese el ID del docente"
                    >
                </div>

                <div class="campo">
                    <label for="doce_nombre">Nombre completo</label>

                    <input
                        type="text"
                        id="doce_nombre"
                        name="doce_nombre"
                        required
                        placeholder="Ingrese el nombre completo"
                    >
                </div>

                <div class="campo">
                    <label for="doce_identificacion">Identificación</label>

                    <input
                        type="text"
                        id="doce_identificacion"
                        name="doce_identificacion"
                        placeholder="Número de identificación"
                    >
                </div>

                <div class="fila">

                    <div class="campo">
                        <label for="doce_direccion">Dirección</label>

                        <input
                            type="text"
                            id="doce_direccion"
                            name="doce_direccion"
                            required
                            placeholder="Dirección de residencia"
                        >
                    </div>

                    <div class="campo">
                        <label for="doce_telefono">Teléfono</label>

                        <input
                            type="tel"
                            id="doce_telefono"
                            name="doce_telefono"
                            required
                            placeholder="Número de teléfono"
                        >
                    </div>

                </div>

                <div class="campo">
                    <label for="doce_email">Correo electrónico</label>

                    <input
                        type="email"
                        id="doce_email"
                        name="doce_email"
                        required
                        placeholder="ejemplo@correo.com"
                    >
                </div>

                <div class="campo">
                    <label for="doce_especialidad">Especialidad</label>

                    <input
                        type="text"
                        id="doce_especialidad"
                        name="doce_especialidad"
                        required
                        placeholder="Ej: Matemáticas, Inglés, Ciencias..."
                    >
                </div>


                <div class="botones">

                    <a href="Home_Admin.html" class="btn cancelar">Cancelar</a>

                    <button type="submit" class="btn guardar">
                        Crear docente
                    </button>

                </div>

            </form>

        </div>

    </div>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
<script src="JS/Crear Docente.js"></script> 
</body>

</html>
