<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="CSS/estilos bacanos.css">
</head>
<body>

    <header>
        <h1>Institución Educativa</h1>
    </header>

    <main class="perfil-contenedor">

        <div class="perfil">
            <h2>Crear nombre de usuario</h2>

            <form id="formPerfil">

                <div class="campo">
                    <label for="usuario">Ingresa aqui tu usuario o apodo de identificacion</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        placeholder="Escribe tu nombre de usuario"
                        maxlength="20"
                        required
                    >
                </div>

                <button type="submit">Guardar</button>

                <p id="mensaje"></p>

            </form>
        </div>

    </main>

    <script>
        const formulario = document.getElementById("formPerfil");
        const usuario = document.getElementById("usuario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const nombreUsuario = usuario.value.trim();

            localStorage.setItem("nombreUsuario", nombreUsuario);

            mensaje.textContent = "Nombre de usuario guardado correctamente.";
            mensaje.className = "mensaje-exito";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
