<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Institución Educativa</title>

    <link rel="stylesheet" href="CSS/estilos bacanos.css">

</head>


<body>


    <header>

        <h1>Institución Educativa</h1>

        <p>Plataforma Académica</p>

    </header>


    <main class="contenedor-login">

        <section class="login">

            <h2>Iniciar Sesión</h2>

            <p class="texto-login">
                Ingresa tu correo y contraseña
            </p>


            <form id="formularioLogin">


                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="contraseña">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contraseña"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="boton-login">

                    Iniciar sesión

                </button>


            </form>


            <p id="mensaje"></p>


            <div class="informacion-login">

                <p>
                    ¡Ingresa tus datos de forma correcta
                    para identificar si eres estudiante o docente!
                </p>

            </div>


        </section>

    </main>


    <footer>

        <p>
            © 2026 Institución Educativa
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="JS/index.js"></script>


</body>

</html>
